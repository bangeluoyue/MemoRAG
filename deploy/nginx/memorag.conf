# Replace demo.example.com and certificate paths before installing.
# Install only after the certificate exists. HTTP never proxies login/API.
limit_req_zone $binary_remote_addr zone=memorag_login:1m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name demo.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/memorag-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://demo.example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.example.com;
    ssl_certificate /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /opt/memorag/frontend/dist;
    index index.html;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /api/auth/login {
        limit_req zone=memorag_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/memorag-proxy.inc;
    }
    location /api/ { include /etc/nginx/memorag-proxy.inc; }
    location = /health { include /etc/nginx/memorag-proxy.inc; }
    location ~ /\. { deny all; }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
