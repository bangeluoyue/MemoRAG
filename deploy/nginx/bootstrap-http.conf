# Temporary ACME-only site, before a certificate is installed. No app or login.
server {
    listen 80;
    listen [::]:80;
    server_name demo.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/memorag-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
